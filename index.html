<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick a Card</title>
<style>
  :root { --gold:#f5d27a; --gold2:#b8862b; --deep:#120a2e; --violet:#3a1c71; --pink:#d76d77; }
  html { scrollbar-gutter:stable; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:#fff; font-family:Georgia,'Times New Roman',serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px;
    background:radial-gradient(circle at 20% 15%,#4b2a8f55,transparent 45%),
               radial-gradient(circle at 85% 85%,#d76d7733,transparent 45%),
               linear-gradient(160deg,#0c0720,var(--deep) 60%,#1b0f3d);
    overflow-x:hidden; }
  .stars { position:fixed; inset:0; pointer-events:none;
    background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 120px 90px,#ffe9a8,transparent),
      radial-gradient(2px 2px at 220px 160px,#fff,transparent),
      radial-gradient(1px 1px at 300px 40px,#fff,transparent);
    background-size:320px 220px; opacity:.55; }
  h1 { margin:0; font-size:clamp(1.8rem,5vw,3rem); letter-spacing:.08em; text-align:center;
    background:linear-gradient(90deg,var(--gold),#fff,var(--gold)); -webkit-background-clip:text; background-clip:text;
    color:transparent; text-shadow:0 0 30px #f5d27a55; }
  p { margin:0; opacity:.8; font-style:italic; text-align:center; }
  .row { display:flex; flex-wrap:wrap; gap:26px; justify-content:center; position:relative; max-width:1100px; }

  .card { width:170px; height:250px; perspective:1000px; cursor:pointer; border:0; background:none; padding:0;
    animation:float 4s ease-in-out infinite; transition:transform .2s, opacity .3s; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .card:hover { transform:scale(1.07) rotate(-2deg); }
  .card:hover .back { box-shadow:0 0 28px 6px var(--glow), 0 14px 30px #000a; }
  .card.flipped { animation:none; }
  .card.flipped:hover { transform:scale(1.04); }

  /* The picked card flies to the front and grows; every other card fades away. */
  .card.picked, .card.returning { animation:none; transition:transform .45s cubic-bezier(.3,1.1,.4,1), opacity .3s; }
  .card.picked { z-index:50; }
  .row.has-pick .card:not(.picked) { opacity:0; pointer-events:none; }
  .inner { position:relative; width:100%; height:100%; transition:transform .45s cubic-bezier(.3,1.2,.5,1); transform-style:preserve-3d; }
  .card.flipped .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    overflow:hidden; box-shadow:0 14px 30px #000a; }

  /* ---- card designs: Christmas red, Christmas green, and gold ---- */
  .card.xmas-red   { --edge:#fff4dc; --frame:#fff4dc; --ink:#fff4dc; --ring:#f5d27a; --glow:#ff6b6bcc;
    --disc:radial-gradient(circle,#146b36,#07381b);
    --bg:radial-gradient(#ffffffcc 1.6px,transparent 2.2px) 0 0/24px 24px,
         radial-gradient(#ffffff77 1.1px,transparent 1.7px) 12px 12px/24px 24px,
         linear-gradient(160deg,#d12a38,#7d0a14); }
  .card.xmas-green { --edge:#f5d27a; --frame:#f5d27a; --ink:#f5d27a; --ring:#f5d27a; --glow:#6bff9acc;
    --disc:radial-gradient(circle,#a31220,#5e0710);
    --bg:radial-gradient(#d4202f 2.4px,transparent 3px) 0 0/26px 26px,
         radial-gradient(#d4202f 2.4px,transparent 3px) 13px 13px/26px 26px,
         repeating-linear-gradient(45deg,#0f6a38 0 12px,#0b5a2e 12px 24px); }
  .card.gold       { --edge:#7a5200; --frame:#f5d27a; --ink:#5a3b00; --ring:#fff1a8; --glow:#ffe27acc;
    --disc:radial-gradient(circle,#3b2600,#1a0f00);
    --bg:repeating-linear-gradient(45deg,#ffffff2a 0 2px,transparent 2px 14px),
         repeating-linear-gradient(-45deg,#00000018 0 2px,transparent 2px 14px),
         linear-gradient(135deg,#fff1a8,#f5d27a 22%,#b8862b 50%,#f7dc85 75%,#fff1a8); }

  .back { border:3px solid var(--edge); transition:box-shadow .3s; background:var(--bg);
    display:flex; align-items:center; justify-content:center; }
  .back::before { content:""; position:absolute; inset:9px; border:1.5px dashed var(--edge); border-radius:12px; opacity:.85; }
  .back::after { content:""; position:absolute; top:0; left:-80%; width:50%; height:100%;
    background:linear-gradient(100deg,transparent,#ffffff55,transparent); transform:skewX(-20deg);
    animation:shine 3.5s ease-in-out infinite; }
  @keyframes shine { 0%{left:-80%} 60%,100%{left:150%} }
  /* gift-ribbon band behind the emblem on the Christmas cards */
  .card.xmas-red .back .band, .card.xmas-green .back .band {
    position:absolute; left:0; right:0; top:50%; height:34px; transform:translateY(-50%);
    background:linear-gradient(#f5d27a,#b8862b 55%,#f5d27a); opacity:.9; box-shadow:0 2px 6px #0006; }
  .emblem { width:92px; height:92px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:2.8rem; color:#f5d27a; background:var(--disc);
    border:3px solid var(--ring); box-shadow:0 0 14px #0008, inset 0 0 18px #0006; z-index:1; }
  .corner { position:absolute; color:var(--ink); font-size:1.15rem; z-index:1; }
  .tl{top:14px;left:16px} .br{bottom:14px;right:16px;transform:rotate(180deg)}

  .front { transform:rotateY(180deg); background:#111; border:4px solid var(--frame);
    box-shadow:0 0 30px var(--glow), 0 14px 30px #000a; display:flex; align-items:center; justify-content:center; }
  .front img { width:100%; height:100%; object-fit:cover; }
  .ph { padding:12px; text-align:center; font-size:.95rem; color:var(--gold); }

  .go { background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#2a1a00; border:0; padding:13px 32px;
    border-radius:999px; font:700 1rem Georgia,serif; letter-spacing:.06em; cursor:pointer;
    box-shadow:0 6px 20px #f5d27a44; transition:transform .2s, box-shadow .2s; }
  .go:hover { transform:translateY(-2px) scale(1.04); box-shadow:0 10px 28px #f5d27a88; }

  #status { min-height:1.4em; color:var(--gold); letter-spacing:.12em; transition:opacity .3s; opacity:0; }
  #status.on { opacity:1; }
  .spark { position:fixed; width:8px; height:8px; border-radius:50%; background:var(--gold); pointer-events:none;
    box-shadow:0 0 10px var(--gold); animation:burst .6s ease-out forwards; }
  @keyframes burst { to { transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; } }
  @media (prefers-reduced-motion:reduce){ .card,.back::after,.emblem,.stars{animation:none} }
</style>
</head>
<body>
  <div class="stars"></div>
  <h1>✦ Pick a Card ✦</h1>
  <p>Choose wisely... every card hides a surprise.</p>
  <div id="status">🔀 Shuffling the cards...</div>
  <div class="row" id="row"></div>
  <button class="go" id="shuffle">Shuffle the deck</button>

<script>
  // ====== PUT YOUR PICTURES HERE ======
  // Save your pictures in the SAME folder as this file, named:
  // image1.jpg, image2.jpg, image3.jpg ... (png, jpeg, webp also work)
  // Change this number to get more or fewer cards:
  const CARD_COUNT = 10;
  const IMAGES = Array.from({ length: CARD_COUNT }, (_, i) => "image" + (i + 1));
  const EXTS = ["jpg", "png", "jpeg", "webp"];
  // Each card plays the sound with the same number as its picture:
  // image1 -> audio1.mp3, image2 -> audio2.mp3 ... (wav, ogg, m4a also work)
  const AUDIO_EXTS = ["mp3", "wav", "ogg", "m4a"];
  // =====================================

  // Back designs: 2 red Christmas, 2 green Christmas, 2 gold (shuffled onto the cards).
  const STYLES = [
    { cls: "xmas-red",   emblem: "🎄", corner: "❄" },
    { cls: "gold",       emblem: "★",  corner: "✦" },
    { cls: "xmas-green", emblem: "🎁", corner: "❄" },
    { cls: "gold",       emblem: "🔔", corner: "✦" },
    { cls: "xmas-red",   emblem: "⛄", corner: "❄" },
    { cls: "xmas-green", emblem: "🎅", corner: "❄" }
  ];

  const row = document.getElementById("row");

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function makeImg(name) {
    const img = new Image();
    let n = 0;
    img.alt = name;
    img.onerror = () => {
      n++;
      if (n < EXTS.length) img.src = name + "." + EXTS[n];
      else img.replaceWith(Object.assign(document.createElement("div"),
        { className: "ph", textContent: "Add " + name + ".jpg" }));
    };
    img.src = name + "." + EXTS[0];
    return img;
  }

  const players = [];
  const cards = [];
  let dealId = 0;          // changes on every new deal, to cancel old timers
  let lastOpened = null;   // the card that was opened most recently

  // Fly the picked card to the middle of the screen, big, in front.
  function placePicked(card) {
    const prev = card.style.transform;
    card.style.transform = "none";
    const r = card.getBoundingClientRect();
    card.style.transform = prev;
    const dx = innerWidth / 2 - (r.left + r.width / 2);
    const dy = innerHeight / 2 - (r.top + r.height / 2);
    const k = Math.min(2.1, innerHeight * 0.72 / r.height, innerWidth * 0.86 / r.width);
    card.style.transform = `translate(${dx}px,${dy}px) scale(${k})`;
  }

  function closeCard(c) {
    c.sound.stop();
    const card = c.card;
    card.classList.remove("flipped");
    if (!card.classList.contains("picked")) return;
    card.classList.remove("picked");
    card.classList.add("returning");          // glide back to its spot
    card.style.transform = "";
    row.classList.remove("has-pick");         // bring the other cards back
    document.documentElement.style.overflow = "";
    window.setTimeout(() => card.classList.remove("returning"), 500);
  }

  function makeAudio(name) {
    const base = name.replace("image", "audio");
    const audio = new Audio();
    let n = 0;
    audio.preload = "auto";
    audio.addEventListener("error", () => {
      n++;
      if (n < AUDIO_EXTS.length) {
        audio.src = base + "." + AUDIO_EXTS[n];
        if (audio.dataset.want) audio.play().catch(() => {});
      }
    });
    audio.src = base + "." + AUDIO_EXTS[0];
    return {
      play() { audio.dataset.want = "1"; audio.currentTime = 0; audio.play().catch(() => {}); },
      stop() { delete audio.dataset.want; audio.pause(); audio.currentTime = 0; }
    };
  }

  // Visibly shuffle: all cards gather into a pile in the middle, then fly out to new random spots.
  function randomizeCardPositions() {
    const first = cards.map(c => c.card.getBoundingClientRect());
    const oldPos = cards.map(c => c.pos);

    // Make sure the deck really changes order (most cards must move).
    let order, moved, tries = 0;
    do {
      order = shuffle(cards);
      moved = order.filter((c, i) => c.pos !== i).length;
      tries++;
    } while (moved < Math.ceil(cards.length / 2) && tries < 20);

    order.forEach((c, i) => { c.pos = i; c.card.style.order = i; });
    const last = cards.map(c => c.card.getBoundingClientRect());

    const status = document.getElementById("status");
    status.classList.add("on");

    // Pile point: the middle of the card area.
    const rr = row.getBoundingClientRect();
    const cx = rr.left + rr.width / 2, cy = rr.top + rr.height / 2;
    const n = cards.length;

    const anims = cards.map((c, idx) => {
      const lw = last[idx].width, lh = last[idx].height;
      const dx = first[idx].left - last[idx].left;      // where it started
      const dy = first[idx].top - last[idx].top;
      const gx = cx - (last[idx].left + lw / 2);        // the pile
      const gy = cy - (last[idx].top + lh / 2);
      const holdEnd = 0.5 + (c.pos / n) * 0.16;         // cards leave the pile one after another
      c.card.style.zIndex = 20 + c.pos;
      const a = c.card.animate([
        { offset: 0, transform: `translate(${dx}px,${dy}px)`, easing: "cubic-bezier(.5,0,.3,1)" },
        { offset: 0.38, transform: `translate(${gx}px,${gy}px)` },
        { offset: holdEnd, transform: `translate(${gx}px,${gy}px)`, easing: "cubic-bezier(.2,.7,.2,1)" },
        { offset: 1, transform: "translate(0,0)" }
      ], { duration: 1300, fill: "backwards" });
      return a.finished.catch(() => {}).then(() => { c.card.style.zIndex = ""; });
    });

    return Promise.all(anims).then(() => status.classList.remove("on"));
  }

  function sparkle(el) {
    const r = el.getBoundingClientRect();
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("span");
      s.className = "spark";
      s.style.left = r.left + r.width / 2 + "px";
      s.style.top = r.top + r.height / 2 + "px";
      const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 90;
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 600);
    }
  }

  function deal() {
    lastOpened = null;
    dealId++;
    row.classList.remove("has-pick");
    document.documentElement.style.overflow = "";
    row.style.pointerEvents = "";
    document.getElementById("status").classList.remove("on");
    players.forEach(a => a.stop());
    players.length = 0;
    cards.length = 0;
    row.innerHTML = "";
    const styles = shuffle(Array.from({ length: IMAGES.length }, (_, k) => STYLES[k % STYLES.length]));
    shuffle(IMAGES).forEach((name, i) => {
      const st = styles[i];
      const card = document.createElement("button");
      card.className = "card " + st.cls;
      card.style.animationDelay = -(i * 0.7) + "s";
      card.innerHTML = '<div class="inner"><div class="face back"><div class="band"></div><span class="corner tl">' + st.corner + '</span>' +
        '<div class="emblem">' + st.emblem + '</div><span class="corner br">' + st.corner + '</span></div><div class="face front"></div></div>';
      card.querySelector(".front").appendChild(makeImg(name));
      const sound = makeAudio(name);
      players.push(sound);
      const me = { card, sound, pos: i };
      cards.push(me);
      const openIt = () => {
        card.classList.add("flipped", "picked");
        row.classList.add("has-pick");          // hide all the other cards
        document.documentElement.style.overflow = "hidden";
        placePicked(card);
        sound.play();
        window.setTimeout(() => sparkle(card), 300);
      };
      card.onclick = () => {
        // Clicking the open card just closes it. Nothing moves.
        if (card.classList.contains("flipped")) {
          closeCard(me);
          return;
        }

        const wasOpen = cards.filter(c => c !== me && c.card.classList.contains("flipped"));
        // Picking a DIFFERENT card than last time is when the deck moves.
        const isNewCard = lastOpened !== null && lastOpened !== me;
        lastOpened = me;

        // First card, or the same card again: just open it. No rearranging.
        if (!isNewCard) {
          wasOpen.forEach(closeCard);
          openIt();
          return;
        }

        // A different card was clicked: NOW the positions change.
        // 1) the open card closes by itself, 2) the deck gathers and spreads, 3) the clicked card opens.
        const myDeal = dealId;
        row.style.pointerEvents = "none";   // lock clicks while this plays
        wasOpen.forEach(closeCard);
        window.setTimeout(() => {
          if (myDeal !== dealId) return;
          randomizeCardPositions().then(() => {
            if (myDeal !== dealId) return;
            row.style.pointerEvents = "";
            openIt();
          });
        }, wasOpen.length ? 500 : 0);
      };
      row.appendChild(card);
    });
  }

  window.addEventListener("resize", () => {
    const c = cards.find(x => x.card.classList.contains("picked"));
    if (c) placePicked(c.card);
  });

  document.getElementById("shuffle").onclick = deal;
  deal();
</script>
</body>
</html>
